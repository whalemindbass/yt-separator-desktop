<!doctype html>
<meta charset="utf-8">
<title>basic-pitch 전체 채보 · YIN 비교</title>
<body><pre id="out">running…</pre>
<script type="module">
import { outputToNotes, toNotes, Mat, AUDIO_N_SAMPLES, HOP_SIZE, OVERLAP_LEN,
         N_OVERLAPPING_FRAMES, ANNOTATIONS_FPS } from './workers/bp-notes.js';
import { transcribe, assignFrets, midiToName, TUNINGS } from './workers/tab-core.js';

const Q = decodeURIComponent((location.search.match(/[?&]q=([^&]*)/) || [])[1] || '').split('|');
const [MODEL, WAV] = Q;
const LIMIT = Number(Q[2] || 0);      // 0 = 전체, 아니면 앞 N초만

const lines = [];
const say = (s) => { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); };

function decimate2(src) {
  const n = (src.length - 3) >> 1;
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const j = i * 2; out[i] = (src[j] + 3*src[j+1] + 3*src[j+2] + src[j+3]) / 8; }
  return out;
}

try {
  const mod = await import('./lib/ort.webgpu.bundle.min.mjs');
  const ORT = mod.default || mod;
  ORT.env.wasm.wasmPaths = new URL('./lib/', location.href).href;
  ORT.env.wasm.numThreads = 1;

  const modelBuf = await (await fetch(MODEL)).arrayBuffer();
  const session = await ORT.InferenceSession.create(modelBuf,
    { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });

  const ab = await (await fetch(WAV)).arrayBuffer();
  const audio = await new AudioContext().decodeAudioData(ab);
  const L = audio.getChannelData(0);
  const R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : L;
  let mono = new Float32Array(L.length);
  for (let i = 0; i < L.length; i++) mono[i] = (L[i] + R[i]) * 0.5;
  const origSr = audio.sampleRate;
  let sr = origSr, sig = mono;
  while (sr > 30000) { sig = decimate2(sig); sr = sr / 2; }
  if (LIMIT > 0) { sig = sig.slice(0, Math.round(LIMIT * sr)); mono = mono.slice(0, Math.round(LIMIT * origSr)); }
  const dur = sig.length / sr;
  say(`오디오 ${dur.toFixed(1)}s · 모델 입력 ${sr}Hz`);

  // 앞쪽에 overlap/2 만큼 0 을 덧대고 HOP_SIZE 로 창을 낸다 (원본과 동일)
  const padded = new Float32Array(OVERLAP_LEN / 2 + sig.length);
  padded.set(sig, OVERLAP_LEN / 2);

  const nOlap = N_OVERLAPPING_FRAMES / 2;
  const framesRows = [], onsetRows = [];
  const t0 = performance.now();
  let windows = 0;
  for (let off = 0; off < padded.length; off += HOP_SIZE) {
    const win = new Float32Array(AUDIO_N_SAMPLES);
    win.set(padded.subarray(off, Math.min(padded.length, off + AUDIO_N_SAMPLES)));
    const feed = {}; feed[session.inputNames[0]] = new ORT.Tensor('float32', win, [1, AUDIO_N_SAMPLES, 1]);
    const r = await session.run(feed);
    // 88 채널이 note/onset, 264 가 contour
    const outs = session.outputNames.map(k => r[k]);
    const note = outs.find(t => t.dims[2] === 88 && t !== undefined);
    const cands = outs.filter(t => t.dims[2] === 88);
    const [a, b] = cands;                 // :2 = note, :1 = onset (앞서 확인한 순서)
    const T = a.dims[1];
    for (let f = nOlap; f < T - nOlap; f++) {
      const fr = new Float32Array(88), on = new Float32Array(88);
      for (let c = 0; c < 88; c++) { fr[c] = a.data[f * 88 + c]; on[c] = b.data[f * 88 + c]; }
      framesRows.push(fr); onsetRows.push(on);
    }
    windows++;
    if (windows % 20 === 0) say(`  창 ${windows}개 처리…`);
  }
  const infMs = performance.now() - t0;

  const T = framesRows.length;
  const fm = new Mat(new Float32Array(T * 88), T, 88);
  const om = new Mat(new Float32Array(T * 88), T, 88);
  for (let r = 0; r < T; r++) for (let c = 0; c < 88; c++) { fm.set(r, c, framesRows[r][c]); om.set(r, c, onsetRows[r][c]); }

  const t1 = performance.now();
  // 베이스 음역으로 제한 (E1~E4). 그 위는 다른 악기 누수로 본다.
  const events = outputToNotes(fm, om, { minFreq: 38, maxFreq: 340, minNoteLen: 11 });
  let cand = toNotes(events);

  // 단음화 — 베이스는 한 번에 한 음. 겹치면 낮은 음을 남긴다(베이스는 바닥을 친다).
  cand.sort((a, b) => a.start - b.start || a.midi - b.midi);
  const mono2 = [];
  for (const n of cand) {
    const prev = mono2[mono2.length - 1];
    if (!prev) { mono2.push({ ...n }); continue; }
    const prevEnd = prev.start + prev.dur;
    if (n.start < prevEnd - 0.02) {           // 겹침
      if (n.midi < prev.midi) {               // 더 낮은 음이면 교체
        prev.dur = Math.max(0.05, n.start - prev.start);
        mono2.push({ ...n });
      } else {
        prev.dur = Math.max(prev.dur, (n.start + n.dur) - prev.start);
      }
    } else mono2.push({ ...n });
  }
  const bpNotes = assignFrets(mono2, '4', 22);
  const postMs = performance.now() - t1;

  say(`\n[basic-pitch] 추론 ${(infMs/1000).toFixed(1)}s · 후처리 ${(postMs/1000).toFixed(1)}s · 노트 ${bpNotes.length}개`);

  const t2 = performance.now();
  const yin = transcribe(mono, origSr, { tuning: '4' });
  say(`[자체 YIN]   처리 ${((performance.now()-t2)/1000).toFixed(1)}s · 노트 ${yin.notes.length}개`);

  const stat = (label, notes) => {
    if (!notes.length) return say(`${label}: 없음`);
    const mids = notes.map(n => n.midi).sort((a, b) => a - b);
    const oct = {};
    for (const n of notes) { const o = Math.floor(n.midi / 12) - 1; oct[o] = (oct[o] || 0) + 1; }
    say(`${label}  중앙 ${midiToName(mids[mids.length>>1])} · 범위 ${midiToName(mids[0])}~${midiToName(mids[mids.length-1])}`
      + ` · 밀도 ${(notes.length/dur).toFixed(2)}/s · 옥타브 ` +
      Object.entries(oct).sort((a,b)=>a[0]-b[0]).map(([o,c]) => `${o}옥${Math.round(c/notes.length*100)}%`).join(' '));
  };
  stat('[basic-pitch]', bpNotes);
  stat('[자체 YIN]  ', yin.notes);

  const dump = (label, notes) => {
    say(`\n${label} 앞 20음`);
    say('  ' + notes.slice(0, 20).map(n => `${midiToName(n.midi)}@${n.start.toFixed(1)}`).join(' '));
  };
  dump('[basic-pitch]', bpNotes);
  dump('[자체 YIN]', yin.notes);
} catch (e) { say('ERROR: ' + (e && (e.stack || e.message) || e)); }
console.log('###RESULT###\n' + lines.join('\n'));
</script>
