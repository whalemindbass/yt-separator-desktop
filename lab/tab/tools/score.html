<!doctype html>
<meta charset="utf-8">
<title>정답지 채점</title>
<!-- npm run lab -- score  로 연다
     ?q=<베이스>|<정답지>|<드럼>|<기타>|<보컬>
     드럼부터는 없어도 된다 — 있으면 박자 격자에 붙인 결과도 같이 잰다. -->
<body><pre id="out">running…</pre>
<script type="module">
import { transcribe, transcribeCrepe } from './workers/tab-core.js';
import { runBasicPitch } from './workers/bp-run.js';
import { runCrepe } from './workers/crepe-run.js';
import { detectBeats } from './scripts/beat-detect.js';

const Q = decodeURIComponent((location.search.match(/[?&]q=([^&]*)/) || [])[1] || '').split('|');
const [WAV, GT, DRUMS, OTHER, VOCALS] = Q;
const lines = [];
const say = (s) => { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); };

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function nameToMidi(s) {
  const m = /^([A-G]#?)(-?\d+)$/.exec(s);
  if (!m) return null;
  const i = NOTE_NAMES.indexOf(m[1]);
  return i < 0 ? null : (Number(m[2]) + 1) * 12 + i;
}

/** 정답지 파싱 — 블록마다 시각 줄과 음이름 줄이 짝을 이룬다 */
function parseGt(text) {
  const times = [], names = [];
  for (const ln of text.split(/\r?\n/)) {
    if (/^\s*#/.test(ln)) continue;
    const tok = ln.trim().split(/\s+/).filter(Boolean);
    if (!tok.length) continue;
    if (tok.every(t => /^\d+(\.\d+)?$/.test(t))) times.push(...tok.map(Number));
    else if (tok.every(t => /^[A-G]#?-?\d+$/.test(t))) names.push(...tok.map(nameToMidi));
  }
  // 옛 덤프는 시각 열 폭이 고정이라 100초를 넘으면 백의 자리가 잘렸다 (104.8 → 04.8).
  // 시각은 반드시 증가하므로 줄어들면 100 씩 더해 되돌린다.
  let base = 0, prev = -1;
  const fixed = times.map(t => {
    let v = t + base;
    while (v < prev) { base += 100; v = t + base; }
    prev = v; return v;
  });
  const n = Math.min(fixed.length, names.length);
  return fixed.slice(0, n).map((t, i) => ({ start: t, midi: names[i] }));
}

/** 정답지 대비 채점 — 가장 가까운 검출음과 일대일로 맞춘다 */
function score(gt, det, tol = 0.25, octaveLenient = false) {
  const used = new Set();
  let hit = 0, pitchWrong = 0, miss = 0;
  const missed = [], wrong = [];
  for (const g of gt) {
    let best = -1, bd = Infinity;
    for (let i = 0; i < det.length; i++) {
      if (used.has(i)) continue;
      const d = Math.abs(det[i].start - g.start);
      if (d < bd && d <= tol) { bd = d; best = i; }
    }
    if (best < 0) { miss++; missed.push(g); continue; }
    used.add(best);
    const ok = octaveLenient ? (det[best].midi - g.midi) % 12 === 0 : det[best].midi === g.midi;
    if (ok) hit++; else { pitchWrong++; wrong.push({ g, d: det[best] }); }
  }
  const extras = det.filter((_, i) => !used.has(i));
  return { hit, pitchWrong, miss, extra: extras.length, pct: Math.round(hit / gt.length * 100), missed, wrong, extras };
}

/** 놓친 음들이 어디에 몰려 있는지 — 원인을 짚으려면 개수보다 자리가 필요하다 */
function whereMissed(gt, s) {
  const L = [];
  // 직전 음과 같은 음정인가 (반복 타현) · 직전 음과의 간격
  const idx = new Map(gt.map((g, i) => [g, i]));
  let sameAsPrev = 0, fast = 0;
  const gaps = [];
  for (const m of s.missed) {
    const i = idx.get(m);
    if (i > 0) {
      if (gt[i - 1].midi === m.midi) sameAsPrev++;
      const gap = m.start - gt[i - 1].start;
      gaps.push(gap);
      if (gap < 0.2) fast++;
    }
  }
  gaps.sort((a, b) => a - b);
  L.push(`#   놓친 ${s.missed.length}음 중 — 직전과 같은 음정 ${sameAsPrev} · 직전과 0.2초 이내 ${fast}`);
  if (gaps.length) L.push(`#   앞 음과의 간격 중앙값 ${gaps[gaps.length >> 1].toFixed(3)}초 (최소 ${gaps[0].toFixed(3)})`);
  return L;
}

const prog = (s) => console.log('###PROGRESS### ' + s);   // pYIN 시간 진단용 — 임시

try {
  prog('정답지 로드 중…');
  const gt = parseGt(await (await fetch(GT)).text());
  say(`정답지 ${gt.length}음 · ${gt[0].start}s ~ ${gt[gt.length-1].start}s`);

  prog('오디오 fetch 중…');
  const ab = await (await fetch(WAV)).arrayBuffer();
  prog(`오디오 ${(ab.byteLength / 1048576).toFixed(1)}MB 받음 — 디코드 중…`);
  const audio = await new AudioContext().decodeAudioData(ab);
  prog(`디코드 끝 — ${(audio.length / audio.sampleRate).toFixed(1)}초`);
  const L = audio.getChannelData(0);
  const R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : L;
  const mono = new Float32Array(L.length);
  for (let i = 0; i < L.length; i++) mono[i] = (L[i] + R[i]) * 0.5;
  const sr = audio.sampleRate;

  const fmt = (label, det, detail = false) => {
    const s = score(gt, det);
    say(`${label.padEnd(16)} 검출 ${String(det.length).padStart(3)} · 일치 ${String(s.hit).padStart(3)} (${s.pct}%)`
      + ` · 음정오류 ${String(s.pitchWrong).padStart(2)} · 놓침 ${String(s.miss).padStart(2)} · 잉여 ${String(s.extra).padStart(2)}`
      + ` · 옥타브무시 ${score(gt, det, 0.25, true).pct}%`);
    if (detail && s.missed.length) for (const ln of whereMissed(gt, s)) say(ln);
    return s;
  };

  prog('YIN 채보 중…');
  const yin = transcribe(mono, sr, { tuning: '4' }).notes;
  fmt('[YIN]', yin, true);
  // pYIN 실험(lab/tab/README.md 10번 절) — 기본은 꺼져 있다. 여기서만 켜서 견준다.
  prog('pYIN 채보 중(전체 곡 Viterbi — 시간이 더 걸린다)…');
  const t0 = performance.now();
  const pyinNotes = transcribe(mono, sr, { tuning: '4', pitchTracker: 'pyin' },
    (pct) => { if (pct % 10 === 0) prog(`  pYIN ${pct}%`); }).notes;
  prog(`pYIN 끝 — ${((performance.now() - t0) / 1000).toFixed(1)}초 걸림`);
  fmt('[pYIN]', pyinNotes, true);

  // CREPE 실험(lab/tab/README.md 11번 절) — ONNX 추론이 비동기라 transcribe() 가 아니라
  // runCrepe() 로 먼저 살리언스를 뽑고 transcribeCrepe() 에 넘긴다.
  prog('CREPE 살리언스 추론 중(ONNX, 처음엔 모델 로드도 포함)…');
  const t1 = performance.now();
  const { frames: crepeSal, hopSec: crepeHop, ep: crepeEp } = await runCrepe(mono, sr, new URL('./', location.href).href, 10,
    (() => { let last = -1; return (pct) => { if (pct !== last && pct % 5 === 0) { last = pct; prog(`  CREPE 추론 ${pct}%`); } }; })());
  prog(`CREPE 추론 끝 — ${((performance.now() - t1) / 1000).toFixed(1)}초 · 프레임 ${crepeSal.length}개 · 실행 ${crepeEp}`);
  const crepeNotes = transcribeCrepe(crepeSal, crepeHop, mono, sr, { tuning: '4' }).notes;
  fmt('[CREPE]', crepeNotes, true);

  // 박자를 줄 수 있으면 격자에 붙인 결과도 같이 잰다.
  // 문서에 남은 87%/잉여 0 이 이 구성에서 나온 것인지 여기서 갈린다.
  if (DRUMS) {
    const load = async (u) => {
      const a = await new AudioContext().decodeAudioData(await (await fetch(u)).arrayBuffer());
      const L = a.getChannelData(0);
      return { L, R: a.numberOfChannels > 1 ? a.getChannelData(1) : L };
    };
    const dr = await load(DRUMS);
    let mix = null;
    if (OTHER && VOCALS) {   // 드럼만으로 템포가 안 잡히는 곡이 있다 — 합친 믹스를 폴백으로
      const parts = [{ L, R }, dr, await load(OTHER), await load(VOCALS)];
      const n = Math.min(...parts.map(p => p.L.length));
      const mL = new Float32Array(n), mR = new Float32Array(n);
      for (const p of parts) for (let i = 0; i < n; i++) { mL[i] += p.L[i]; mR[i] += p.R[i]; }
      mix = [mL, mR];
    }
    const bt = await detectBeats(dr.L, dr.R, sr, mix);
    say(`# 박 ${bt.beats.length}개 · BPM ${bt.tempo ? bt.tempo.toFixed(1) : '?'}`);
    fmt('[YIN+격자]', transcribe(mono, sr, { tuning: '4', beats: bt.beats }).notes);
  } else {
    say('# 드럼 스템이 없어 격자 정렬은 재지 않았다');
  }

  // 온셋 임계값 스윕.
  //
  // 막다른 길 표에는 "임계값을 낮추면 얻는 음 1개당 잔음 6개"로 적혀 있다. 그 판정은
  // 검출기에서 파생된 정답지로 잰 것이라 새 검출이 무조건 잉여로 보였다 — 다시 재야 한다.
  // 정답지가 독립적일 때만 이 표가 뜻을 갖는다.
  // 위쪽 옥타브 보정 스윕. 이 값은 다른 곡(디스코 옥타브 주법)을 위해 넣은 것이라,
  // 이 곡의 음정을 깎지 않는지 반드시 같이 봐야 한다. 한 곡에서 고른 값은 그 곡의 습관일 수 있다.
  say('');
  say('# octUpRatio 스윕 — 옥타브 오류가 늘지 않는지');
  for (const [r, h2] of [[0.25,1.0],[0.25,1.1],[0.25,1.2],[0.35,1.0],[0.35,1.2],[0.5,1.2],[0.7,1.2]]) {
    const det = transcribe(mono, sr, { tuning: '4', octUpRatio: r, octUpH2: h2 }).notes;
    const s = score(gt, det);
    say(`#   up ${String(r).padEnd(5)} h2 ${String(h2).padEnd(4)} 일치 ${String(s.hit).padStart(3)} (${String(s.pct).padStart(2)}%)`
      + ` · 음정오류 ${String(s.pitchWrong).padStart(3)} · 놓침 ${String(s.miss).padStart(2)}`
      + ` · 옥타브무시 ${score(gt, det, 0.25, true).pct}%`);
  }

  say('');
  say('# 온셋 임계값 스윕 — 얻는 음 대비 잉여');
  const base = score(gt, transcribe(mono, sr, { tuning: '4' }).notes);
  for (const th of [0.08, 0.05, 0.035, 0.02, 0.012]) {
    const s = score(gt, transcribe(mono, sr, { tuning: '4', onsetThresh: th }).notes);
    const gained = s.hit - base.hit, added = s.extra - base.extra;
    const cost = gained > 0 ? (added / gained).toFixed(1) : '—';
    say(`#   thresh ${String(th).padEnd(5)} 일치 ${String(s.hit).padStart(3)} (${String(s.pct).padStart(2)}%)`
      + ` · 놓침 ${String(s.miss).padStart(2)} · 잉여 ${String(s.extra).padStart(2)}`
      + `   기준 대비 +${gained}음 / 잉여 +${added}  (1음당 ${cost})`);
  }

  // 문턱을 최선으로 두고도 남는 것 — 여기서부터는 분절의 문제다
  say('');
  fmt('[YIN th=0.02]', transcribe(mono, sr, { tuning: '4', onsetThresh: 0.02 }).notes, true);

  // 온셋용 에너지 창 × 문턱.
  //
  // 피치 창(93ms)으로 잰 에너지에서는 150ms 간격 반복의 상승이 평균에 묻힌다. 창을 줄이면
  // 봉우리는 서지만 잡음도 같이 커지므로 문턱을 함께 올려야 한다. 둘은 따로 못 고른다.
  say('');
  say('# 온셋 창 × 문턱  (일치% / 잉여)');
  const winsMs = [0, 8, 12, 20, 30, 46];
  const ths = [0.08, 0.12, 0.18, 0.25, 0.35];
  say('#   창\\문턱 ' + ths.map(t => String(t).padStart(11)).join(''));
  for (const w of winsMs) {
    const cells = ths.map(th => {
      const s = score(gt, transcribe(mono, sr, { tuning: '4', onsetWinMs: w, onsetThresh: th }).notes);
      return `${String(s.pct).padStart(4)}% /${String(s.extra).padStart(4)}`;
    });
    say(`#   ${String(w === 0 ? '피치창' : w + 'ms').padEnd(7)}` + cells.join(''));
  }

  const bp = await runBasicPitch(mono, sr, new URL('./', location.href).href);
  fmt('[basic-pitch]', bp);
} catch (e) { say('ERROR: ' + (e && (e.stack || e.message) || e)); }
console.log('###RESULT###\n' + lines.join('\n'));
</script>
