<!doctype html>
<meta charset="utf-8">
<title>TAB 덤프</title>
<body><pre id="out">running…</pre>
<script type="module">
import { transcribe, midiToName, TUNINGS, TECH_GLYPH } from './workers/tab-core.js';

const P = new URLSearchParams(location.search);
// 실행기(npm run lab)는 q= 로 파일 목록을 준다. f= 는 실행기 이전의 손URL 방식 — 둘 다 받는다.
const FILE = P.get('f')
  || decodeURIComponent((location.search.match(/[?&]q=([^&]*)/) || [])[1] || '').split('|')[0];
const TUNING = P.get('t') || '4';
const PER_LINE = 16;               // 한 줄에 담을 노트 수

const lines = [];
const say = (s) => lines.push(s);

try {
  const ab = await (await fetch(FILE)).arrayBuffer();
  const audio = await new AudioContext().decodeAudioData(ab);
  const L = audio.getChannelData(0);
  const R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : L;
  const mono = new Float32Array(L.length);
  for (let i = 0; i < L.length; i++) mono[i] = (L[i] + R[i]) * 0.5;

  const r = transcribe(mono, audio.sampleRate, { tuning: TUNING });
  const n = r.notes;
  const tun = TUNINGS[TUNING];
  const NAMES = { '4': ['E', 'A', 'D', 'G'], '5': ['B', 'E', 'A', 'D', 'G'], '5H': ['E', 'A', 'D', 'G', 'C'] }[TUNING];

  say(`# ${FILE.split('/').pop()}  ·  ${audio.duration.toFixed(1)}초  ·  튜닝 ${tun.label}`);
  say(`# 노트 ${n.length}개`);
  say('# 각 줄 위의 숫자는 그 노트가 시작하는 시각(초)');
  say('');

  for (let i = 0; i < n.length; i += PER_LINE) {
    const chunk = n.slice(i, i + PER_LINE);
    const t0 = chunk[0].start;
    const cols = chunk.map(x => {
      const g = x.tech ? TECH_GLYPH[x.tech] : '';
      const f = x.string != null ? g + x.fret : '?';
      return f.padEnd(3, '-');                           // 폭 3 으로 통일 (기호 자리)
    });
    // 시각 헤더
    const head = chunk.map(x => {
      // 100초를 넘으면 5자리다 — 자르면 백의 자리를 잃는다
      return x.start.toFixed(1).padStart(4);
    }).join(' ');
    say(`      ${head}`);
    for (let s = tun.strings.length - 1; s >= 0; s--) {
      const row = chunk.map((x, k) => (x.string === s ? cols[k] : '---')).join('--');
      say(`  ${NAMES[s]} |-${row}-|`);
    }
    // 음이름 줄 — 악보와 대조하기 쉽게
    say(`      ${chunk.map(x => midiToName(x.midi).padStart(4)).join(' ')}`);
    say('');
  }
} catch (e) { say('ERROR: ' + (e && (e.stack || e.message) || e)); }

document.getElementById('out').textContent = lines.join('\n');
console.log('###RESULT###\n' + lines.join('\n'));
</script>
