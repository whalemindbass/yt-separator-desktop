<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 검색엔진에 올리지 않는다. 주소를 감추는 것이 방어는 아니지만, 굳이 광고할 이유도 없다. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>공지 작성</title>
<style>
  :root {
    --bg: #0d1117; --surface: #151b23; --elev: #1c232c;
    --border: #262d38; --tx1: #e6edf3; --tx2: #9aa7b4; --tx3: #6e7b8a;
    --accent: #3ddc97; --accent-fg: #06231a; --err: #f06a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px; background: var(--bg); color: var(--tx1);
    font: 14px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .lede { color: var(--tx3); font-size: 12.5px; margin: 0 0 22px; }
  fieldset { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 16px 18px; margin: 0 0 16px; }
  legend { padding: 0 6px; font-size: 12.5px; color: var(--tx2); }
  label { display: block; font-size: 12px; color: var(--tx2); margin: 10px 0 5px; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    background: var(--elev); border: 1px solid var(--border); color: var(--tx1);
    font: inherit;
  }
  textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1; min-width: 120px; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--tx2); }
  .check input { width: auto; flex: none; }
  button {
    padding: 9px 15px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
    background: var(--elev); border: 1px solid var(--border); color: var(--tx1);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger  { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 12.5px; margin-top: 10px; min-height: 18px; }
  .msg.err { color: var(--err); }
  .msg.ok  { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-top: 1px solid var(--border); vertical-align: top; }
  th { color: var(--tx3); font-weight: 600; font-size: 11.5px; border-top: 0; }
  .tag { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; background: var(--elev); border: 1px solid var(--border); color: var(--tx2); }
  .tag.draft { color: var(--err); border-color: var(--err); }
  .tag.pin { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button { padding: 5px 9px; font-size: 12px; font-weight: 500; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>공지 작성</h1>
  <p class="lede">앱 홈 화면에 뜨는 공지를 쓰고 고칩니다. 관리자 계정으로 로그인하며, 세션은 이 브라우저 탭에만 남습니다.</p>

  <fieldset id="auth-box">
    <legend>로그인</legend>
    <div class="row">
      <div>
        <label for="username">아이디</label>
        <input id="username" type="text" autocomplete="username" placeholder="admin" />
      </div>
      <div>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <button class="primary" id="login" style="flex:none">로그인</button>
    </div>
    <div class="msg" id="auth-msg"></div>
  </fieldset>

  <div id="app" class="hidden">
    <fieldset>
      <legend id="form-legend">새 공지</legend>
      <div class="row">
        <div>
          <label for="kind">종류</label>
          <select id="kind">
            <option value="notice">공지 — 왼쪽 목록</option>
            <option value="update">업데이트 — 오른쪽 버전 이력</option>
            <option value="tip">팁 — 왼쪽 목록</option>
          </select>
        </div>
        <div>
          <label for="lang">언어</label>
          <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select>
        </div>
      </div>
      <label for="title">제목 <span id="title-hint" style="color:var(--tx3)"></span></label>
      <input id="title" type="text" maxlength="120" placeholder="업데이트면 v1.4.11 처럼 버전만 적습니다" />
      <label for="body">본문 — 굵게 **글자**, 목록 - 항목, 링크 [글자](https://…)</label>
      <textarea id="body" maxlength="4000" placeholder="- 무엇이 바뀌었는지&#10;- 사용자가 겪던 문제 기준으로"></textarea>
      <div class="row" style="margin-top:12px">
        <label class="check" style="flex:none"><input type="checkbox" id="pinned" /> 맨 위 고정</label>
        <label class="check" style="flex:none"><input type="checkbox" id="publish" checked /> 바로 공개</label>
        <span style="flex:1"></span>
        <button id="cancel-edit" class="hidden" style="flex:none">취소</button>
        <button class="primary" id="save" style="flex:none">저장</button>
      </div>
      <div class="msg" id="save-msg"></div>
    </fieldset>

    <fieldset>
      <legend>목록 <span style="color:var(--tx3)">(초안 포함)</span></legend>
      <table>
        <thead><tr><th style="width:64px">종류</th><th>제목</th><th style="width:96px">게시일</th><th style="width:170px">동작</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="msg" id="list-msg"></div>
    </fieldset>
  </div>
</div>

<script>
const BASE = 'https://ytseparator.com/community/api';
const API = BASE + '/yts/notices';
const $ = (id) => document.getElementById(id);
// sessionStorage — 탭을 닫으면 사라진다. localStorage 에 두면 기기에 계속 남는다.
const KEY = 'yts:token';
let editing = null;

const say = (el, text, cls) => { const e = $(el); e.textContent = text; e.className = 'msg' + (cls ? ' ' + cls : ''); };
const token = () => sessionStorage.getItem(KEY) || '';

async function call(method, path, body) {
  const res = await fetch(API + (path || ''), {
    method,
    headers: {
      'Authorization': 'Bearer ' + token(),
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    // 401 은 세션이 없거나 만료, 403 은 로그인은 됐지만 관리자가 아님 — 고칠 곳이 다르다
    const msg = res.status === 401 ? '로그인이 풀렸습니다. 다시 로그인하세요.'
              : res.status === 403 ? '이 계정은 관리자가 아닙니다. (ADMIN_USER_IDS 확인)'
              : res.status === 429 ? '시도가 너무 잦습니다. 15분 뒤에 다시 하세요.'
              : (data && data.error) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}

const fmt = (ms) => {
  if (!ms) return '—';
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const KIND_KO = { notice: '공지', update: '업데이트', tip: '팁' };

async function refresh() {
  say('list-msg', '');
  try {
    const d = await call('GET');
    const rows = d.notices || [];
    $('rows').innerHTML = rows.length ? rows.map(n => `
      <tr>
        <td><span class="tag">${esc(KIND_KO[n.kind] || n.kind)}</span></td>
        <td>
          ${n.pinned ? '<span class="tag pin">고정</span> ' : ''}
          ${n.draft ? '<span class="tag draft">초안</span> ' : ''}
          ${esc(n.title)}
          <div style="color:var(--tx3);font-size:11.5px">${esc(n.lang)}</div>
        </td>
        <td style="color:var(--tx3)">${fmt(n.publishedAt)}</td>
        <td><div class="acts">
          <button data-edit="${esc(n.id)}">고치기</button>
          <button data-pub="${esc(n.id)}" data-to="${n.draft ? '1' : '0'}">${n.draft ? '공개' : '내리기'}</button>
          <button class="danger" data-del="${esc(n.id)}">삭제</button>
        </div></td>
      </tr>`).join('') : '<tr><td colspan="4" style="color:var(--tx3)">아직 없습니다.</td></tr>';
  } catch (e) {
    say('list-msg', e.message, 'err');
  }
}

function fillForm(n) {
  editing = n ? n.id : null;
  $('form-legend').textContent = n ? '공지 고치기' : '새 공지';
  $('kind').value = n ? n.kind : 'notice';
  $('lang').value = n ? n.lang : 'ko';
  $('title').value = n ? n.title : '';
  $('body').value = n ? n.body : '';
  $('pinned').checked = n ? !!n.pinned : false;
  $('publish').checked = n ? !n.draft : true;
  $('cancel-edit').classList.toggle('hidden', !n);
  say('save-msg', '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/** 세션이 살아 있는지 실제 요청으로 확인하고, 되면 화면을 넘긴다 */
async function enter() {
  await call('GET');
  $('auth-box').classList.add('hidden');
  $('app').classList.remove('hidden');
  refresh();
}

$('login').addEventListener('click', async () => {
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) return say('auth-msg', '아이디와 비밀번호를 넣으세요.', 'err');

  $('login').disabled = true;
  say('auth-msg', '로그인 중…');
  try {
    const res = await fetch(BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    let d = null;
    try { d = await res.json(); } catch {}
    // 서버가 이유를 말해 주면 그대로 보여준다 — 여기서 다시 지어내면 틀린 안내가 된다
    if (!res.ok || !d || !d.token) {
      throw new Error((d && d.error)
                   || (res.status === 401 ? '아이디나 비밀번호가 맞지 않습니다.' : 'HTTP ' + res.status));
    }
    sessionStorage.setItem(KEY, d.token);
    $('password').value = '';
    await enter();
  } catch (e) {
    sessionStorage.removeItem(KEY);
    say('auth-msg', e.message, 'err');
  } finally {
    $('login').disabled = false;
  }
});
for (const id of ['username', 'password']) {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login').click(); });
}

$('save').addEventListener('click', async () => {
  const payload = {
    kind: $('kind').value,
    lang: $('lang').value,
    title: $('title').value.trim(),
    body: $('body').value.trim(),
    pinned: $('pinned').checked,
    publish: $('publish').checked,
  };
  if (!payload.title || !payload.body) return say('save-msg', '제목과 본문이 필요합니다.', 'err');
  $('save').disabled = true;
  try {
    if (editing) await call('PATCH', '/' + editing, payload);
    else await call('POST', '', payload);
    say('save-msg', editing ? '고쳤습니다.' : '올렸습니다.', 'ok');
    fillForm(null);
    refresh();
  } catch (e) {
    say('save-msg', e.message, 'err');
  } finally {
    $('save').disabled = false;
  }
});

$('cancel-edit').addEventListener('click', () => fillForm(null));

$('rows').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    if (b.dataset.edit) {
      const d = await call('GET');
      fillForm((d.notices || []).find(x => x.id === b.dataset.edit));
      return;
    }
    if (b.dataset.pub) {
      await call('PATCH', '/' + b.dataset.pub, { publish: b.dataset.to === '1' });
      refresh(); return;
    }
    if (b.dataset.del) {
      if (!confirm('삭제합니다. 되돌릴 수 없습니다.')) return;
      await call('DELETE', '/' + b.dataset.del);
      refresh(); return;
    }
  } catch (err) {
    say('list-msg', err.message, 'err');
  }
});

// 같은 탭 안에서 새로고침했을 때는 다시 로그인시키지 않는다
if (token()) enter().catch(() => sessionStorage.removeItem(KEY));
else $('username').focus();
</script>
</body>
</html>
